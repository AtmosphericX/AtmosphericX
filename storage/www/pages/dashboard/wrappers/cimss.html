<h1 id="welcome-title" class="title text-primary text-neutral">CIMSS</h1>
<div class="dashboard-layout">
    <div class="dashboard-main">
        <div id="dashboard-grid" class="grid span-3">
        </div>
    </div>
    <aside class="dashboard-info-panel">
        <section class="discord-panel">
            <div class="discord-panel-header">
                <h3 class="discord-panel-title">Project AtmosphericX Discord</h3>
            </div>
            <p class="discord-panel-subtitle">Join the AtmosphericX server for updates and support.</p>
            <div class="discord-right">
                <iframe
                    src="https://discord.com/widget?id=1358154190437744730&theme=dark"
                    class="discord-iframe"
                    title="AtmosphericX Discord Server"
                    referrerpolicy="strict-origin-when-cross-origin"
                    loading="lazy"
                    sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
                ></iframe>
            </div>
            <div class="discord-panel-actions">
                <a class="btn-discord btn-primary bg-info hover" href="https://atmosphericx-discord.scriptkitty.cafe" target="_blank" rel="noopener noreferrer" >
                    Join Discord
                </a>
            </div>
        </section>
    </aside>
</div>
